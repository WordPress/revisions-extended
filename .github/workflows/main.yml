name: CI

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: npm run setup:tools

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Run JavaScript unit tests
        run: npm run test:unit

      - name: Lint PHP
        run: npm run lint:php

      # The pinned @wordpress/env spawns the docker-compose v1 binary, which
      # GitHub removed from hosted runners; alias it to Compose v2.
      - name: Shim docker-compose
        run: |
          printf '#!/bin/sh\nexec docker compose "$@"\n' | sudo tee /usr/local/bin/docker-compose > /dev/null
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Run PHP unit tests
        run: |
          npm run env
          npm run test:php
